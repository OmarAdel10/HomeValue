name: home_value
description: "HomeValue — Linux desktop app for house price prediction. Input property features (income, rooms, location, etc.), select ML model, get instant price estimates with model comparison charts. Powered by scikit-learn + FastAPI backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  fl_chart: ^0.68.0
  material_design_icons_flutter: ^7.0.7296
  http: ^1.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4
  go_router: ^14.2.1
  get_it: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
