name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [development, master]

permissions:
  contents: read

jobs:
  python-backend:
    name: Python Backend (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ./ml_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ml_backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,viz]

      - name: Run code formatting check
        run: |
          black --check src tests
          ruff check src tests

      - name: Run type checking
        run: |
          mypy src

      - name: Verify pytest config from repository root
        working-directory: .
        run: |
          test -f pytest.ini
          test ! -e ml_backend/pytest.ini
          test ! -e ml_backend/setup.cfg
          test ! -e ml_backend/tox.ini
          ! grep -q '\[tool.pytest.ini_options\]' ml_backend/pyproject.toml
          out=$(python -m pytest --collect-only --strict-markers)
          grep -qx 'configfile: pytest.ini' <<<"$out"
          grep -qx "rootdir: $PWD" <<<"$out"
          grep -Eq '[0-9]+ tests collected' <<<"$out"

      - name: Run tests with coverage
        run: |
          pytest --cov=ml_backend --cov-report=xml --cov-fail-under=95

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./ml_backend/coverage.xml
          flags: python-${{ matrix.python-version }}
          name: python-${{ matrix.python-version }}

  flutter-app:
    name: Flutter App (${{ matrix.flutter-channel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter-channel: [stable]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ matrix.flutter-channel }}
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev \
            libglib2.0-dev cmake ninja-build clang libstdc++-12-dev xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test integration_test

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Linux release
        run: flutter build linux --release

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-build
          path: build/linux/x64/release/bundle/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-backend, flutter-app]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: ml_backend/pyproject.toml

      - name: Install Python dependencies
        run: |
          cd ml_backend
          python -m pip install --upgrade pip
          pip install -e .[dev,viz]

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev \
            libglib2.0-dev cmake ninja-build clang libstdc++-12-dev xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Train model
        run: |
          cd ml_backend
          python -m ml_backend.api.train

      - name: Start FastAPI server
        run: |
          cd ml_backend
          nohup python -m uvicorn ml_backend.server:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          echo $! > server.pid
          sleep 5

      - name: Verify server health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy"
          cat ml_backend/server.log || true
          exit 1

      - name: Run Flutter integration tests
        run: |
          xvfb-run -a flutter test integration_test/app_test.dart -d linux

      - name: Stop FastAPI server
        if: always()
        run: |
          if [ -f ml_backend/server.pid ]; then
            kill $(cat ml_backend/server.pid) 2>/dev/null || true
          fi