name: HomeValue CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-backend:
    name: ML Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml_backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check formatting
        run: |
          black --check src/ tests/
          ruff format --check src/ tests/
      - name: Lint
        run: |
          ruff check src/ tests/
          mypy src/
      - name: Test
        run: pytest tests/ -v --cov=ml_backend --cov-branch --cov-report=term-missing
      - name: Wheel import smoke test
        run: |
          pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheel=$(ls dist/*.whl)
          "$RUNNER_TEMP/wheel-env/bin/pip" install --quiet "${wheel}[viz]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import ml_backend; from ml_backend.data import explore, loader; from ml_backend import preprocessing"

  flutter:
    name: Flutter Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Linux (debug)
        run: flutter build linux --debug
