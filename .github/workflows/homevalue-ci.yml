name: HomeValue CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["development", "master"]

jobs:
  python:
    name: ML Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "ml_backend/.python-version"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Format check
        run: make format
      - name: Lint
        run: make lint
      - name: Test with coverage
        run: make test
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Wheel smoke test
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheel=$(ls dist/*.whl)
          "$RUNNER_TEMP/wheel-env/bin/pip" install --quiet "${wheel}[viz]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import ml_backend; from ml_backend.data import explore, loader; from ml_backend import preprocessing, models"

  flutter:
    name: Flutter Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Get dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Linux (debug)
        run: flutter build linux --debug
      - name: Build Linux (release)
        run: flutter build linux --release