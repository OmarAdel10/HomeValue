name: HomeValue CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag name
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $REF_NAME"
            exit 1
          fi
      - name: Require master ancestry
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Test backend
        working-directory: ml_backend
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v --cov=ml_backend --cov-branch --cov-report=term-missing
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test Flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build:
    name: Build release artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Python wheel
        working-directory: ml_backend
        run: |
          pip install build
          python -m build --wheel
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build Linux release
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package artifacts
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/homevalue-linux-$REF_NAME.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            homevalue-linux-*.tar.gz
            ml_backend/dist/*.whl

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
