name: HomeValue CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag name
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $REF_NAME"
            exit 1
          fi
      - name: Require exact master tip
        run: |
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('ml_backend/pyproject.toml').read_text())['project']['version'])")
          test "v$version" = "$REF_NAME"
      - name: Check formatting and lint
        working-directory: ml_backend
        run: |
          pip install -e ".[dev]"
          black --check src/ tests/
          ruff format --check src/ tests/
          ruff check src/ tests/
          mypy src/
      - name: Test backend
        working-directory: ml_backend
        run: pytest tests/ -v --cov=ml_backend --cov-branch --cov-report=term-missing
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Test Flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build:
    name: Build release artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Build Python wheel
        working-directory: ml_backend
        run: |
          pip install build
          python -m build --wheel
          test -n "$(ls dist/*.whl)"
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build Linux release
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package artifacts
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/homevalue-linux-$REF_NAME.tar.gz" .
          test -s "$GITHUB_WORKSPACE/homevalue-linux-$REF_NAME.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            homevalue-linux-*.tar.gz
            ml_backend/dist/*.whl

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
