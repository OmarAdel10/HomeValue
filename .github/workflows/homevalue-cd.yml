name: HomeValue CD

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libglib2.0-dev \
            cmake \
            ninja-build \
            clang \
            libstdc++-12-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "ml_backend/.python-version"
          cache: "pip"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Get dependencies
        run: flutter pub get
      - name: Install dependencies
        working-directory: ml_backend
        run: pip install -e ".[dev]"
      - name: Build wheel
        working-directory: ml_backend
        run: |
          pip install build
          python -m build --wheel
      - name: Build Linux bundle
        run: |
          flutter build linux --release
      - name: Create release artifacts
        run: |
          mkdir -p artifacts
          cp ml_backend/dist/*.whl artifacts/
          tar -czf artifacts/homevalue-linux-${GITHUB_REF_NAME}.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true